    <script type="text/javascript">
        if (window != top)
            top.location.href = "Index.aspx";

        var token_en_th = { en: "A14E808731C345E8A7E88654A892FC8B",
                        th: "2D89A8D7C196435ABBA8A9CAECBBD6D69DB4BB553EE3474CA7121FD3089E5010" };
        function submitForm(yhm, casn) {
            var yonghumi = $("#YONGHUMING").val() || '';
            var mima = $("#MIMA").val() || '';
            var yanzhengma = '';
            var type = "1";
            if (yhm) {
                type = "2";
                yonghumi = yhm;
                mima = casn;
            }

            if (yonghumi == "") {
                errShow("帐号不能为空。");
                $("#YONGHUMING").focus();
                return;
            }

            if (mima.length == "") {
                errShow("密码不能为空。");
                $("#MIMA").focus();
                return;
            }
            
            var path = "ashx/LoginHandler.ashx?action=LOGIN";
            path += "&YONGHUMING=" + encodeURIComponent(yonghumi) + "&" + openUrlHandle("MIMA", mima) + "&YANZHENGMA=" + yanzhengma + "&TYPE=" + type;
            errHide();
            $.ajax({
                type: "POST",
                url: path,
                dataType: "json",
                success: function (obj) {
                    switch (parseInt(obj.opType)) {
                        case 0:
                            
                            if ("1" == "1" && obj.msg <= 5) {

                                qrshow();
                            } else {
                                SetCookie("username_yljgxm", yonghumi);
                                location.href = "https://ggws.hnhfpc.gov.cn/FormMain.aspx";
                            }
                            break;
             
                        case 5:
                            alert(obj.msg);
                            document.location.href = obj.type;
                            break;
                        default:
                            errShow(obj.msg);
                            $("#MIMA").val("");
                            $("#YANZHENGMA").val("");
                            $("#MIMA").focus();
                            break;
                    }
                }
            });
        }
        var dhxWins;
        var qrshow = function () {
            dhxWins = new dhtmlXWindows();
            var window_sendsms = dhxWins.createWindow('w_qrcode', 0, 0, 650, 550);
            window_sendsms.centerOnScreen();
            window_sendsms.button("close").hide();
            window_sendsms.setText("扫码验证");
            window_sendsms.setModal(true);
            window_sendsms.attachURL("Pg_ScanQrCode.aspx?href=" + "https://ggws.hnhfpc.gov.cn/FormMain.aspx" + "&etc=" + new Date().getTime());
        }
        var smsshow = function () {
            dhxWins.window("w_qrcode").close();
            var window_sendsms = dhxWins.createWindow('w_sendsms', 0, 0, 450, 200);
            window_sendsms.centerOnScreen();
            window_sendsms.button("close").hide();
            window_sendsms.setText("短信验证码");
            window_sendsms.setModal(true);
            window_sendsms.attachURL("Pg_SendSMS.aspx?href=" + "https://ggws.hnhfpc.gov.cn/FormMain.aspx" + "&etc=" + new Date().getTime());
        }

        document.onkeydown = function (e) {
            if (!e) e = window.event; //火狐中是 window.event
            if ((e.keyCode || e.which) == 13) {
                submitForm();
            }
        }
        window.onload = function () {
            var user_name = getCookie("username_yljgxm");
            if (user_name != null) {
                $("#YONGHUMING").val(user_name);
                $("#MIMA").focus();
            }
        }
    </script>

<body>

    <script type="text/javascript" language="javascript" src="js/jquery/jquery.js"></script>
    <script type="text/javascript" language="javascript" src="js/jquery/jquery.LoadImage.js"></script>
    <script language="javascript" type="text/javascript">
        var iquery;
        var token = "";
        $(function () {
            $(".u-sloga img").LoadImage("images/banner_lazyload.png");

            /*==========登录方式的切换=============*/
            function generate() {
                $.ajax({
                    type: "POST",
                    url: "ashx/LoginHandler.ashx?ACTION=GENERATE",
                    dataType: "json",
                    success: function (r) {
                        console.log(r)
                        switch (r.code) {
                            case 0:
                                $("#qrcode_img").attr("src", r.data.tokenimage);
                                token = r.data.catoken;
                                break;
                        }
                    }
                });
            }

            $('.cover .btn').click(function () {
                errQrCodeHide();
                generate();
                iquery = setInterval(query, 2000);
            })

            function query() {
                $.ajax({
                    type: "POST",
                    url: "ashx/LoginHandler.ashx?ACTION=QUERY&token=" + token,
                    dataType: "json",
                    success: function (r) {
                        switch (r.code) {
                            case 0:
                                location.href = "https://ggws.hnhfpc.gov.cn/FormMain.aspx";
                                break;
                            case 1:
                                errQrCodeShow(r.message);
                                break;
                            case 2:
                                break;
                            case 3:
                                errQrCodeShow(r.message);
                                break;
                            case 4:
                                errQrCodeShow(r.message);
                                break;
                        }
                    }
                });
            }

            $('#screen').on('click', function () {
                document.getElementById("panel-qrcode").style.display = "none";
                document.getElementById("panel-input").style.display = "block";
                if (iquery != null || typeof iquery != "undefined") {
                    clearInterval(iquery);
                }
            });
            $('#qrcode').on('click', function () {
                document.getElementById("panel-input").style.display = "none";
                document.getElementById("panel-qrcode").style.display = "block";
                $('.cover').hide()
                generate();
                iquery = setInterval(query, 2000);
            });

        });

        // 错误显示
        function errShow(msg) {
            $('#errmsg').text(msg)
            $('.m-error').show()
        }
        // 错误隐藏
        function errHide() {
            $('.m-error').hide()
        }

        function errQrCodeShow(msg) {
            $('.txt').text(msg);
            $('.cover').show();
            if (iquery != null || typeof iquery != "undefined") {
                clearInterval(iquery);
            }
        }
        function errQrCodeHide() {
            $('.cover').hide();
        }

    </script>
    <script language="javascript" type="text/javascript">
        $(document).ready(function () {
            var b_name = navigator.appName;
            var b_version = navigator.appVersion;
            var version = b_version.split(";");
            var trim_version = version.length > 1 ? version[1].replace(/[ ]/g, "") : version[0].replace(/[ ]/g, "");
            if (b_name == "Microsoft Internet Explorer") {
                /*如果是IE6或者IE7*/
                if (trim_version == "MSIE7.0" || trim_version == "MSIE6.0") {
                    alert("IE浏览器版本过低，禁止登陆。请更新IE浏览器或使用其他浏览器");
                    //然后跳到需要连接的下载网站
                    window.location.href = "https://support.microsoft.com/zh-cn/help/17621/internet-explorer-downloads";
                }
            }
        });
    </script>
