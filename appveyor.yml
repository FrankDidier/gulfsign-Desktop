image: Visual Studio 2022

environment:
  PY_PYTHON: "3.11"

cache:
  - '%LOCALAPPDATA%\pip\Cache'

install:
  - py -3 --version
  - py -3 -m pip install --upgrade pip
  - py -3 -m pip install requests gmssl cryptography pycryptodome pandas openpyxl pyinstaller

build_script:
  - py -3 -m PyInstaller --onefile --windowed --name "GulfSign" --clean --noconfirm --hidden-import gmssl --hidden-import gmssl.sm4 --hidden-import gmssl.sm3 --hidden-import gmssl.func --hidden-import cryptography --hidden-import Crypto --hidden-import Crypto.Cipher --hidden-import Crypto.PublicKey --hidden-import Crypto.Signature --hidden-import Crypto.Hash --hidden-import Crypto.Util --hidden-import Crypto.Random --hidden-import pandas --hidden-import openpyxl --add-data "hc_api.py;." --add-data "ph3_api.py;." --add-data "sign_engine.py;." --add-data "proxy_capture.py;." --add-data "license_client.py;." --add-data "config_manager.py;." --add-data "batch_processor.py;." app.py
  - dir dist

artifacts:
  - path: dist\GulfSign.exe
    name: GulfSign
    type: file

deploy: off
